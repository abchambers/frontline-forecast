# Fly.io config for the radar worker. App name below is a placeholder —
# `fly launch` (or `fly apps create`) will need a globally-unique name; change
# it here (and keep RADAR_WORKER_URL in the main app's env in sync) if
# "frontline-forecast-radar" is already taken.
app = "frontline-forecast-radar"
primary_region = "iad" # near the us-east-1 S3 buckets this worker reads from.

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # the entire point of this service is a warm cache — never let it scale to zero.
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  # 512mb got OS-OOM-killed (kernel "Out of memory: Killed process", exit
  # 137). 1024mb fixed that but then hit V8's own heap-limit abort instead
  # (exit 134 — see Dockerfile's NODE_OPTIONS). Bumped to 2gb so the
  # explicit --max-old-space-size=1536 in the Dockerfile has real headroom
  # underneath it, both confirmed live via fly logs, not guessed.
  memory = "2048mb"
