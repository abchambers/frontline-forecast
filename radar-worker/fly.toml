# Fly.io config for the radar worker. App name below is a placeholder —
# `fly launch` (or `fly apps create`) will need a globally-unique name; change
# it here (and keep RADAR_WORKER_URL in the main app's env in sync) if
# "frontline-forecast-radar" is already taken.
app = "frontline-forecast-radar"
primary_region = "iad" # near the us-east-1 S3 buckets this worker reads from.

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # the entire point of this service is a warm cache — never let it scale to zero.
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "performance-1x"
  # Upgraded from shared-cpu-1x 2026-08-31 (Andrew's explicit go-ahead, ~$32.19/mo) specifically to
  # unblock the /mosaic endpoint (server.ts) — real measurement showed shared-cpu-1x's CPU quota
  # (5ms per 80ms window, ~6.25% of a core) was the actual cause of the documented 60-210s
  # severe-weather decode incident below, not that severe volumes are inherently much heavier to
  # parse (see radar-worker/scripts/severe-weather-latency.ts: real EF4-producing volumes decoded in
  # 5-9s on unthrottled hardware). A single mosaic request decodes several stations sequentially
  # within one request, so every one of them needed real CPU, not just more machines — see the app's
  # own memory/backlog notes for the full cost investigation before changing this again. Scaled the
  # app down to 1 machine first (a 2nd shared-cpu-1x machine had been running unexplained, providing
  # no benefit to a single-request-bound workload like this one — more machines don't relieve
  # per-request CPU throttling).
  #
  # Memory bumped 2048mb -> 4096mb the same day, ~$10/mo more: the very first live /mosaic test after
  # the CPU upgrade (3 stations) OOM'd for real — `anon-rss:1812500kB`, right at the old 2GB ceiling —
  # confirmed via fly logs, not guessed. Fly's own crash recovery caught it and the service restarted
  # itself within seconds (single-station traffic was never actually down), but a mosaic that can't
  # reliably finish isn't usable for the fine-tuning pass Andrew wants to do next. Below is the
  # ORIGINAL shared-cpu-1x memory-tuning history, kept for context since the same underlying
  # constraints (velocity's extra peak memory, GRID_STEP_DEG's resolution/memory tradeoff) still
  # apply at this tier too, just with more headroom now and real CPU behind them instead of throttled:
  # 512mb got OS-OOM-killed (137), 1024mb hit V8's own heap-limit abort
  # instead (134). 2gb was the real ceiling for shared-cpu-1x — Fly rejected
  # anything higher on that size class (confirmed live: "invalid
  # config.guest.memory_mb, cannot exceed 2048 MiB"). A genuine OOM recurred on the
  # velocity path at 2gb (anon-rss 1.8GB, killed — velocity holds
  # reflectivity + CC + velocity Map<string,...> structures simultaneously,
  # meaningfully more peak memory than reflectivity alone) — addressed by
  # pulling GRID_STEP_DEG back one more notch (server.ts) to reduce the
  # candidate-cell count and its memory footprint, not by paying for more
  # RAM. If a mosaic OOM recurs even at 4gb, the real fix is switching
  # per-cell storage from string-keyed Maps to typed arrays (far lower
  # per-entry overhead) — flagged for later, not attempted at this hour.
  memory = "4096mb"
