<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <title>Frontline Forecast brand-name and sun options</title>
  <desc>Editable vector sheet with three company-name lockups and three sun symbols.</desc>

  <rect id="sheet-background" width="1400" height="900" fill="#FFFFFF"/>

  <!-- BRAND NAME OPTION 1: editorial stacked lockup -->
  <g id="brand-name-option-1" transform="translate(90 100)">
    <rect id="option-1-panel" width="520" height="190" rx="8" fill="#363A9D"/>
    <text x="42" y="76" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" letter-spacing="8">FRONTLINE</text>
    <text x="42" y="128" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" letter-spacing="8">FORECAST</text>
    <rect x="42" y="151" width="160" height="4" fill="#42A5F5"/>
  </g>

  <!-- BRAND NAME OPTION 2: compact horizontal lockup -->
  <g id="brand-name-option-2" transform="translate(90 355)">
    <rect id="option-2-panel" width="520" height="150" rx="8" fill="#363A9D"/>
    <rect x="42" y="42" width="7" height="67" fill="#F04438"/>
    <text x="78" y="73" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing="5">FRONTLINE</text>
    <text x="78" y="111" fill="#42A5F5" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing="5">FORECAST</text>
  </g>

  <!-- BRAND NAME OPTION 3: refined label lockup -->
  <g id="brand-name-option-3" transform="translate(90 570)">
    <rect id="option-3-panel" width="520" height="150" rx="8" fill="#363A9D"/>
    <text x="42" y="70" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" letter-spacing="6">FRONTLINE</text>
    <line x1="42" y1="90" x2="478" y2="90" stroke="#42A5F5" stroke-width="3"/>
    <text x="42" y="124" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" letter-spacing="9">FORECAST</text>
  </g>

  <!-- SUN OPTION 1: simple half-sun with rays -->
  <g id="sun-option-1" transform="translate(850 130)">
    <circle cx="100" cy="100" r="40" fill="#F4B83F"/>
    <g stroke="#F4B83F" stroke-width="10" stroke-linecap="round">
      <line x1="100" y1="28" x2="100" y2="5"/><line x1="100" y1="172" x2="100" y2="195"/>
      <line x1="28" y1="100" x2="5" y2="100"/><line x1="172" y1="100" x2="195" y2="100"/>
      <line x1="49" y1="49" x2="33" y2="33"/><line x1="151" y1="151" x2="167" y2="167"/>
      <line x1="151" y1="49" x2="167" y2="33"/><line x1="49" y1="151" x2="33" y2="167"/>
    </g>
  </g>

  <!-- SUN OPTION 2: clean geometric sun disc -->
  <g id="sun-option-2" transform="translate(1080 130)">
    <circle cx="100" cy="100" r="48" fill="#F4B83F"/>
    <g fill="#F4B83F">
      <path d="M90 16 H110 L100 0 Z"/><path d="M90 184 H110 L100 200 Z"/>
      <path d="M16 90 V110 L0 100 Z"/><path d="M184 90 V110 L200 100 Z"/>
      <path d="M42 42 L56 56 L33 33 Z"/><path d="M158 158 L167 167 L144 144 Z"/>
      <path d="M158 42 L144 56 L167 33 Z"/><path d="M42 158 L56 144 L33 167 Z"/>
    </g>
  </g>

  <!-- SUN OPTION 3: editorial horizon sun -->
  <g id="sun-option-3" transform="translate(850 480)">
    <path d="M35 110 A65 65 0 0 1 165 110 Z" fill="#F4B83F"/>
    <g stroke="#F4B83F" stroke-width="9" stroke-linecap="round">
      <line x1="100" y1="37" x2="100" y2="12"/>
      <line x1="55" y1="55" x2="38" y2="38"/>
      <line x1="145" y1="55" x2="162" y2="38"/>
    </g>
    <line x1="18" y1="112" x2="182" y2="112" stroke="#10131A" stroke-width="9" stroke-linecap="round"/>
    <line x1="48" y1="142" x2="152" y2="142" stroke="#42A5F5" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- SUN OPTION 4: minimal arc, useful at small sizes -->
  <g id="sun-option-4" transform="translate(1080 480)">
    <path d="M35 125 A65 65 0 0 1 165 125" fill="none" stroke="#F4B83F" stroke-width="18" stroke-linecap="round"/>
    <g stroke="#F4B83F" stroke-width="9" stroke-linecap="round">
      <line x1="100" y1="42" x2="100" y2="14"/>
      <line x1="55" y1="58" x2="38" y2="38"/>
      <line x1="145" y1="58" x2="162" y2="38"/>
    </g>
  </g>
</svg>
